name: Deploy Quartz to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare Content
        run: |
          mkdir -p .site-content
          if [ -f INDEX.md ]; then
            cp INDEX.md .site-content/index.md
          elif [ -f README.md ]; then
            cp README.md .site-content/index.md
          fi
          [ -f README.md ] && cp README.md .site-content/README.md
          [ -f WORKFLOW.md ] && cp WORKFLOW.md .site-content/WORKFLOW.md
          [ -d prompts ] && cp -r prompts .site-content/
          [ -d playbooks ] && cp -r playbooks .site-content/
          [ -d learnings ] && cp -r learnings .site-content/

          # 1. 确保首页 index.md 具备完整 frontmatter
          if ! head -n 1 .site-content/index.md | grep -q "^---"; then
            printf -- "---\ntitle: 个人知识库总索引\n---\n\n" | cat - .site-content/index.md > .site-content/index.tmp && mv .site-content/index.tmp .site-content/index.md
          fi

          # 2. 死链容错防御：扫描索引引用的所有文章，缺失时自动生成占位，防止编译崩溃
          grep -oE '(playbooks|prompts)/[a-zA-Z0-9_-]+\.md' .site-content/index.md | sort -u | while read -r f; do
            if [ ! -f ".site-content/$f" ]; then
              mkdir -p "$(dirname ".site-content/$f")"
              printf -- "---\ntitle: $(basename "$f" .md)\nstatus: draft\n---\n\n> 💡 本条目正在整理与同步中...\n" > ".site-content/$f"
            fi
          done

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build Quartz Site
        uses: konstfish/quartz-build-action@v7
        with:
          source: .site-content
          quartz_repo_ref: v4
          quartz_config: .github/quartz/quartz.config.ts
          quartz_layout: .github/quartz/quartz.layout.ts

      - name: Generate CNAME
        run: echo "changelog.feyoudao.cn" > public/CNAME

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
