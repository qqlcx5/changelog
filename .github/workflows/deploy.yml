name: Deploy Quartz to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare Content
        run: |
          mkdir -p .site-content
          if [ -f INDEX.md ]; then
            cp INDEX.md .site-content/index.md
          elif [ -f README.md ]; then
            cp README.md .site-content/index.md
          fi
          [ -f README.md ] && cp README.md .site-content/README.md
          [ -f WORKFLOW.md ] && cp WORKFLOW.md .site-content/WORKFLOW.md
          [ -d prompts ] && cp -r prompts .site-content/
          [ -d playbooks ] && cp -r playbooks .site-content/
          [ -d learnings ] && cp -r learnings .site-content/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build Quartz Site
        uses: konstfish/quartz-build-action@v7
        with:
          source: .site-content
          quartz_config: .github/quartz/quartz.config.ts
          quartz_layout: .github/quartz/quartz.layout.ts

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
