name: Deploy to GitHub Pages (gh-pages branch)

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Prepare Site
        run: |
          mkdir -p public
          cp .github/site/index.html public/index.html
          echo "changelog.feyoudao.cn" > public/CNAME
          ls -la public/

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          force_orphan: true
