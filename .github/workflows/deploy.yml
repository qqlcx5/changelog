name: Build and Deploy Full Knowledge Base to gh-pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Clone Quartz v4 Stable Engine
        run: |
          git clone -b v4 --depth 1 https://github.com/jackyzha0/quartz.git quartz-engine
          cd quartz-engine
          npm ci

      - name: Prepare Content
        run: |
          mkdir -p quartz-engine/content
          
          # 1. 拷贝并净化首页 index.md（注入标准 frontmatter 并剔除触发 AST 崩溃的 HTML 注释）
          printf -- "---\ntitle: 个人知识库总索引\n---\n\n" > quartz-engine/content/index.md
          sed -E '/<!--.*-->/d' INDEX.md >> quartz-engine/content/index.md

          # 2. 拷贝说明与各知识库目录
          [ -f README.md ] && cp README.md quartz-engine/content/README.md
          [ -f WORKFLOW.md ] && cp WORKFLOW.md quartz-engine/content/WORKFLOW.md
          [ -d prompts ] && cp -r prompts quartz-engine/content/
          [ -d playbooks ] && cp -r playbooks quartz-engine/content/
          [ -d learnings ] && cp -r learnings quartz-engine/content/

          # 3. 死链防御兜底：扫描引用的所有 playbook/prompt，如缺失则自动生成占位
          grep -oE '(playbooks|prompts)/[a-zA-Z0-9_-]+\.md' quartz-engine/content/index.md | sort -u | while read -r f; do
            if [ ! -f "quartz-engine/content/$f" ]; then
              mkdir -p "$(dirname "quartz-engine/content/$f")"
              printf -- "---\ntitle: $(basename "$f" .md)\nstatus: draft\n---\n\n> 💡 本条目正在整理与同步中...\n" > "quartz-engine/content/$f"
            fi
          done

      - name: Configure and Build Quartz
        run: |
          # 覆盖配置
          if [ -f ".github/quartz/quartz.config.ts" ]; then
            cp .github/quartz/quartz.config.ts quartz-engine/quartz.config.ts
          fi
          if [ -f ".github/quartz/quartz.layout.ts" ]; then
            cp .github/quartz/quartz.layout.ts quartz-engine/quartz.layout.ts
          fi

          cd quartz-engine
          npx quartz build

          # 生成自定义域名 CNAME
          echo "changelog.feyoudao.cn" > public/CNAME
          ls -la public/

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./quartz-engine/public
          publish_branch: gh-pages
          force_orphan: true
