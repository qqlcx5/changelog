name: Build and Deploy Full Knowledge Base to gh-pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Clone Quartz Engine
        run: |
          git clone --depth 1 https://github.com/jackyzha0/quartz.git quartz-engine
          cd quartz-engine
          npm ci

      - name: Prepare Content
        run: |
          mkdir -p quartz-engine/content
          # 1. 拷贝主页并自动注入标准 frontmatter
          if [ -f INDEX.md ]; then
            cp INDEX.md quartz-engine/content/index.md
          elif [ -f README.md ]; then
            cp README.md quartz-engine/content/index.md
          fi
          if ! head -n 1 quartz-engine/content/index.md | grep -q "^---"; then
            printf -- "---\ntitle: 个人知识库总索引\n---\n\n" | cat - quartz-engine/content/index.md > quartz-engine/content/index.tmp && mv quartz-engine/content/index.tmp quartz-engine/content/index.md
          fi

          # 2. 拷贝说明与契约
          [ -f README.md ] && cp README.md quartz-engine/content/README.md
          [ -f WORKFLOW.md ] && cp WORKFLOW.md quartz-engine/content/WORKFLOW.md

          # 3. 拷贝知识库核心分类
          [ -d prompts ] && cp -r prompts quartz-engine/content/
          [ -d playbooks ] && cp -r playbooks quartz-engine/content/
          [ -d learnings ] && cp -r learnings quartz-engine/content/

          # 4. 容错加固：扫描索引中的引用，如遇未提交或缺失文件自动补齐草稿占位，确保 AST 不崩
          grep -oE '(playbooks|prompts)/[a-zA-Z0-9_-]+\.md' quartz-engine/content/index.md | sort -u | while read -r f; do
            if [ ! -f "quartz-engine/content/$f" ]; then
              mkdir -p "$(dirname "quartz-engine/content/$f")"
              printf -- "---\ntitle: $(basename "$f" .md)\nstatus: draft\n---\n\n> 💡 本条目正在整理与同步中...\n" > "quartz-engine/content/$f"
            fi
          done

      - name: Configure and Build Quartz
        run: |
          cd quartz-engine
          if [ -f "../.github/quartz/quartz.config.yaml" ]; then
            cp ../.github/quartz/quartz.config.yaml ./quartz.config.yaml
          else
            cp quartz.config.default.yaml quartz.config.yaml
          fi

          # 注入站点关键元数据
          sed -i 's|baseUrl: .*|baseUrl: changelog.feyoudao.cn|g' quartz.config.yaml
          sed -i 's|pageTitle: .*|pageTitle: 个人知识库 \| changelog|g' quartz.config.yaml
          sed -i 's|locale: .*|locale: zh-CN|g' quartz.config.yaml

          # 安装依赖插件并构建
          npx quartz plugin install --from-config || true
          npx quartz build

          # 生成自定义域名 CNAME
          echo "changelog.feyoudao.cn" > public/CNAME
          ls -la public/

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./quartz-engine/public
          publish_branch: gh-pages
          force_orphan: true
